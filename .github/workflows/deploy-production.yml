name: Deploy TopScolaire production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: Exact frontend commit to deploy (set by frontend CI)
        required: false
        type: string
      rollback:
        description: Roll back to a previously built image
        required: false
        type: boolean
        default: false
      rollback_image_tag:
        description: Optional IMAGE_TAG to restore; empty selects the previous image
        required: false
        type: string
      approve_migrations:
        description: Approve new migrations after review and PostgreSQL 18 tests
        required: false
        type: boolean
        default: false
      bootstrap_database_identity:
        description: Initialize the permanent database identity after its additive migration
        required: false
        type: boolean
        default: false
      redeploy_api_nginx:
        description: Apply an explicitly reviewed api-nginx infrastructure change
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: topscolaire-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Laravel backend
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: topscolaire_test
          POSTGRES_USER: topscolaire
          POSTGRES_PASSWORD: topscolaire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topscolaire -d topscolaire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: topscolaire_test
      DB_USERNAME: topscolaire
      DB_PASSWORD: topscolaire_test
    steps:
      - name: Checkout backend
        uses: actions/checkout@v7

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, dom, fileinfo, gd, mbstring, pcntl, pdo_pgsql, pdo_sqlite, pgsql, sqlite3, zip
          coverage: none
          ini-file: production
          ini-values: memory_limit=512M

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Test migrations on PostgreSQL 18
        run: php artisan migrate:fresh --force --no-interaction

      - name: Run Laravel tests on PostgreSQL 18
        run: php artisan test --compact

      - name: Build Laravel assets
        run: |
          npm ci
          npm run build

  docker-scan:
    name: Scan ${{ matrix.service }} image
    if: ${{ github.event_name != 'pull_request' && !inputs.rollback }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend]
    steps:
      - name: Validate cross-repository access
        env:
          FRONTEND_REPOSITORY_TOKEN: ${{ secrets.TOPSCOLAIRE_DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$FRONTEND_REPOSITORY_TOKEN" ]]; then
            echo "Missing TOPSCOLAIRE_DEPLOY_DISPATCH_TOKEN in the backend repository secrets." >&2
            exit 1
          fi

      - name: Checkout backend
        uses: actions/checkout@v7

      - name: Checkout frontend
        uses: actions/checkout@v7
        with:
          repository: rochap-r/bulletinlabfrontend
          ref: ${{ inputs.frontend_sha || 'main' }}
          path: frontend
          token: ${{ secrets.TOPSCOLAIRE_DEPLOY_DISPATCH_TOKEN }}
          persist-credentials: false

      - name: Create isolated Docker build environment
        run: |
          cat > .env.production <<'EOF'
          COMPOSE_PROJECT_NAME=topscolaire
          ENV_FILE=.env.production
          IMAGE_TAG=scan
          APP_NAME=TopScolaire
          APP_ENV=production
          APP_KEY=base64:dummykeyfordockerscanonlydummykeyfordockerscanonly==
          APP_DEBUG=false
          APP_URL=https://topscolaire.com
          DB_CONNECTION=pgsql
          DB_HOST=db
          DB_PORT=5432
          DB_DATABASE=topscolaire
          DB_USERNAME=topscolaire
          DB_PASSWORD=dummypassword
          CACHE_STORE=redis
          SESSION_DRIVER=redis
          QUEUE_CONNECTION=redis
          REDIS_HOST=redis
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          MAIL_MAILER=log
          FRONTEND_HTTP_PORT=8080
          API_HTTP_PORT=8081
          ADMINER_HTTP_PORT=8082
          VITE_API_BASE_URL=/api/v1
          EOF

      - name: Build ${{ matrix.service }} image
        run: docker compose --env-file .env.production build --pull ${{ matrix.service }}

      - name: Scan ${{ matrix.service }} image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: bulletinlab/${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload ${{ matrix.service }} scan results
        uses: github/codeql-action/upload-sarif@v4.39.1
        if: ${{ always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != '' }}
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: docker-${{ matrix.service }}

  deploy:
    name: Deploy production
    if: ${{ github.event_name != 'pull_request' && !inputs.rollback }}
    needs: [verify, docker-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://topscolaire.com
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPSCOLAIRE_PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TOPSCOLAIRE_PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topscolaire"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/topscolaire" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/topscolaire" >/dev/null

      - name: Determine frontend SHA
        id: frontend
        env:
          REQUESTED_FRONTEND_SHA: ${{ inputs.frontend_sha }}
          GH_TOKEN: ${{ secrets.TOPSCOLAIRE_DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [[ -n "$REQUESTED_FRONTEND_SHA" ]]; then
            frontend_sha="$REQUESTED_FRONTEND_SHA"
          else
            if [[ -z "$GH_TOKEN" ]]; then
              echo "Missing TOPSCOLAIRE_DEPLOY_DISPATCH_TOKEN in the backend repository secrets." >&2
              exit 1
            fi

            frontend_sha="$(gh api repos/rochap-r/bulletinlabfrontend/commits/main --jq '.sha')"
          fi

          if [[ ! "$frontend_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve a valid frontend SHA." >&2
            exit 1
          fi

          echo "sha=$frontend_sha" >> "$GITHUB_OUTPUT"
          echo "Using frontend SHA: $frontend_sha"

      - name: Deploy exact backend and frontend revisions
        env:
          EXPECTED_BACKEND_SHA: ${{ github.sha }}
          EXPECTED_FRONTEND_SHA: ${{ steps.frontend.outputs.sha }}
          APPROVE_MIGRATIONS: ${{ inputs.approve_migrations }}
          BOOTSTRAP_DATABASE_IDENTITY: ${{ inputs.bootstrap_database_identity }}
          REDEPLOY_API_NGINX: ${{ inputs.redeploy_api_nginx }}
          SSH_HOST: ${{ secrets.TOPSCOLAIRE_PROD_HOST }}
          SSH_USER: ${{ secrets.TOPSCOLAIRE_PROD_USER }}
        run: |
          if [[ ! "$EXPECTED_BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid backend SHA." >&2
            exit 1
          fi

          printf -v remote_command \
            'EXPECTED_BACKEND_SHA=%q EXPECTED_FRONTEND_SHA=%q APPROVE_MIGRATIONS=%q BOOTSTRAP_DATABASE_IDENTITY=%q REDEPLOY_API_NGINX=%q ENV_FILE=/opt/topscolaire/.env.production bash -s' \
            "$EXPECTED_BACKEND_SHA" "$EXPECTED_FRONTEND_SHA" "$APPROVE_MIGRATIONS" "$BOOTSTRAP_DATABASE_IDENTITY" "$REDEPLOY_API_NGINX"

          ssh \
            -i "$HOME/.ssh/topscolaire" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectionAttempts=3 \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$SSH_USER@$SSH_HOST" \
            "$remote_command" < deploy/production-deploy.sh

      - name: Record deployed revisions
        run: |
          echo "Backend SHA: ${{ github.sha }}"
          echo "Frontend SHA: ${{ steps.frontend.outputs.sha }}"

  rollback:
    name: Emergency image rollback
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://topscolaire.com
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPSCOLAIRE_PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TOPSCOLAIRE_PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topscolaire"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/topscolaire" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/topscolaire" >/dev/null

      - name: Restore previous image pair
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
          SSH_HOST: ${{ secrets.TOPSCOLAIRE_PROD_HOST }}
          SSH_USER: ${{ secrets.TOPSCOLAIRE_PROD_USER }}
        run: |
          if [[ -n "$REQUESTED_IMAGE_TAG" && ! "$REQUESTED_IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid rollback image tag." >&2
            exit 1
          fi

          printf -v remote_command \
            'ROLLBACK_ONLY=true ROLLBACK_IMAGE_TAG=%q bash -s' \
            "$REQUESTED_IMAGE_TAG"

          ssh \
            -i "$HOME/.ssh/topscolaire" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectionAttempts=3 \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$SSH_USER@$SSH_HOST" \
            "$remote_command" < deploy/production-deploy.sh
