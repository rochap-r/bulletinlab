name: Deploy TopScolaire production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: Exact frontend commit to deploy (set by frontend CI)
        required: false
        type: string
      skip_verification:
        description: Skip frontend release verification (emergency only)
        required: false
        type: boolean
        default: false
      rollback:
        description: Rollback to previous deployment
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write  # For Trivy SARIF upload

concurrency:
  group: topscolaire-production
  cancel-in-progress: false

env:
  # Default environment variables for deployment
  DEPLOY_TIMEOUT: 1800
  ROLLBACK_ON_FAILURE: true
  # NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}  # Uncomment when configured

jobs:
  verify:
    name: Verify Laravel backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      backend_sha: ${{ steps.checkout.outputs.sha }}
    steps:
      - name: Checkout backend
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for merge-base checks

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, dom, fileinfo, gd, mbstring, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none
          ini-file: production

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run Laravel tests
        run: php artisan test --compact --parallel

      - name: Build Laravel assets
        run: |
          npm ci
          npm run build

  docker-scan:
    name: Scan Docker images for vulnerabilities
    needs: [verify]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create minimal .env for Docker build
        run: |
          cat > .env.production << 'EOF'
          COMPOSE_PROJECT_NAME=topscolaire
          IMAGE_TAG=scan
          APP_NAME=TopScolaire
          APP_ENV=production
          APP_KEY=base64:dummykeyfordockerscanonlydummykeyfordockerscanonly==
          APP_DEBUG=false
          APP_URL=https://topscolaire.com
          DB_CONNECTION=pgsql
          DB_HOST=db
          DB_PORT=5432
          DB_DATABASE=topscolaire
          DB_USERNAME=topscolaire
          DB_PASSWORD=dummypassword
          CACHE_STORE=redis
          SESSION_DRIVER=redis
          QUEUE_CONNECTION=redis
          REDIS_HOST=redis
          REDIS_PASSWORD=dummypassword
          REDIS_PORT=6379
          MAIL_MAILER=log
          FRONTEND_HTTP_PORT=8080
          API_HTTP_PORT=8081
          VITE_API_BASE_URL=/api/v1
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images for scanning
        run: |
          docker compose -f docker-compose.yml build --pull

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: 'bulletinlab/api:latest bulletinlab/frontend:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'docker-image-scan'

  deploy:
    name: Deploy production
    needs: [verify, docker-scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://topscolaire.com
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPSCOLAIRE_PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TOPSCOLAIRE_PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topscolaire"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/topscolaire" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/topscolaire" >/dev/null

      - name: Determine frontend SHA
        id: frontend_sha
        run: |
          # Priority: workflow_dispatch input > fetch from GitHub
          if [[ -n "${{ github.event.inputs.frontend_sha }}" ]]; then
            echo "sha=${{ github.event.inputs.frontend_sha }}" >> $GITHUB_OUTPUT
          else
            # Fetch latest main from frontend repo
            SHA=$(git ls-remote https://github.com/rochap-r/bulletinlabfrontend.git main | cut -f1)
            echo "sha=$SHA" >> $GITHUB_OUTPUT
          fi
          echo "Using frontend SHA: ${sha}"

      - name: Deploy to production
        id: deploy
        env:
          EXPECTED_BACKEND_SHA: ${{ github.sha }}
          EXPECTED_FRONTEND_SHA: ${{ steps.frontend_sha.outputs.sha }}
          SSH_HOST: ${{ secrets.TOPSCOLAIRE_PROD_HOST }}
          SSH_USER: ${{ secrets.TOPSCOLAIRE_PROD_USER }}
          DEPLOY_TIMEOUT: ${{ env.DEPLOY_TIMEOUT }}
          ROLLBACK_ON_FAILURE: ${{ env.ROLLBACK_ON_FAILURE }}
          NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SKIP_VERIFICATION: ${{ github.event.inputs.skip_verification }}
        run: |
          # Validate SHAs
          if [[ ! "$EXPECTED_BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid backend SHA." >&2
            exit 1
          fi

          if [[ -n "$EXPECTED_FRONTEND_SHA" && ! "$EXPECTED_FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid frontend SHA." >&2
            exit 1
          fi

          echo "Deploying backend: $EXPECTED_BACKEND_SHA"
          echo "Deploying frontend: $EXPECTED_FRONTEND_SHA"

          # Stream script to VPS via SSH
          ssh \
            -i "$HOME/.ssh/topscolaire" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_BACKEND_SHA=$EXPECTED_BACKEND_SHA EXPECTED_FRONTEND_SHA=$EXPECTED_FRONTEND_SHA DEPLOY_TIMEOUT=$DEPLOY_TIMEOUT ROLLBACK_ON_FAILURE=$ROLLBACK_ON_FAILURE NOTIFICATION_WEBHOOK=$NOTIFICATION_WEBHOOK SKIP_VERIFICATION=$SKIP_VERIFICATION bash -s" \
            < deploy/production-deploy.sh

      - name: Post-deployment verification
        if: success()
        run: |
          echo "✅ Deployment completed successfully"
          echo "Backend SHA: ${{ github.sha }}"
          echo "Frontend SHA: ${{ steps.frontend_sha.outputs.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed"
          # Additional failure handling could go here
          # The script itself sends notifications via webhook

  rollback:
    name: Emergency rollback
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback == 'true'
    needs: []
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPSCOLAIRE_PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TOPSCOLAIRE_PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topscolaire"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/topscolaire" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/topscolaire" >/dev/null

      - name: Execute rollback on VPS
        env:
          SSH_HOST: ${{ secrets.TOPSCOLAIRE_PROD_HOST }}
          SSH_USER: ${{ secrets.TOPSCOLAIRE_PROD_USER }}
          NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Write rollback script to temp file to avoid heredoc issues in YAML
          cat > /tmp/rollback.sh << 'SCRIPT_EOF'
          set -Eeuo pipefail

          cd /opt/topscolaire

          # Find previous image tag (excluding current)
          CURRENT_TAG=$(docker compose --env-file .env.production images --format '{{.Tag}}' frontend | head -1)
          PREVIOUS_TAG=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep '^bulletinlab/frontend:' \
            | grep -v "^bulletinlab/frontend:${CURRENT_TAG}$" \
            | head -1)

          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "No previous image found for rollback"
            exit 1
          fi

          echo "Rolling back to: $PREVIOUS_TAG"

          # Deploy previous version
          export IMAGE_TAG="$PREVIOUS_TAG"
          docker compose --env-file .env.production up -d --wait --wait-timeout 180
          docker compose --env-file .env.production up -d --wait --wait-timeout 120 --force-recreate --no-deps frontend

          # Verify
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 3 \
            http://127.0.0.1:8081/up | grep -q "Application up"
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 3 \
            --output /dev/null http://127.0.0.1:8080/

          echo "Rollback completed successfully"
          SCRIPT_EOF

          # Copy and execute on VPS
          scp -i "$HOME/.ssh/topscolaire" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/rollback.sh "$SSH_USER@$SSH_HOST:/tmp/rollback.sh"

          ssh \
            -i "$HOME/.ssh/topscolaire" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "NOTIFICATION_WEBHOOK=$NOTIFICATION_WEBHOOK bash /tmp/rollback.sh"