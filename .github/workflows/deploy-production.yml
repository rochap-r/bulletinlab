name: Deploy TopScolaire production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: Exact frontend commit to deploy (set by the frontend CI)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: topscolaire-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Laravel backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout backend
        uses: actions/checkout@v7

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, dom, fileinfo, gd, mbstring, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run Laravel tests
        run: php artisan test --compact

      - name: Build Laravel assets
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://topscolaire.com
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPSCOLAIRE_PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TOPSCOLAIRE_PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topscolaire"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/topscolaire" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/topscolaire" >/dev/null

      - name: Deploy latest backend and frontend main branches
        env:
          EXPECTED_BACKEND_SHA: ${{ github.sha }}
          EXPECTED_FRONTEND_SHA: ${{ inputs.frontend_sha }}
          SSH_HOST: ${{ secrets.TOPSCOLAIRE_PROD_HOST }}
          SSH_USER: ${{ secrets.TOPSCOLAIRE_PROD_USER }}
        run: |
          if [[ ! "$EXPECTED_BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid backend SHA." >&2
            exit 1
          fi

          if [[ -n "$EXPECTED_FRONTEND_SHA" && ! "$EXPECTED_FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid frontend SHA." >&2
            exit 1
          fi

          ssh \
            -i "$HOME/.ssh/topscolaire" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_BACKEND_SHA=$EXPECTED_BACKEND_SHA EXPECTED_FRONTEND_SHA=$EXPECTED_FRONTEND_SHA bash -s" \
            < deploy/production-deploy.sh
