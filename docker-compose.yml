# Stack Docker unifiée — BulletinLab (local, reflète la production)
# Nom du projet : topscolaire
#
# Usage :
#   docker compose --env-file .env.docker config --quiet
#   docker compose --env-file .env.docker build
#   docker compose --env-file .env.docker --profile maintenance run --rm migrate
#   docker compose --env-file .env.docker up -d
#
# Adminer (profil optionnel) :
#   docker compose --env-file .env.docker --profile tools up -d adminer

name: topscolaire

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-service: &api-service
  image: bulletinlab/api:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  env_file:
    - ${ENV_FILE:-.env.production}
  init: true
  networks:
    - backend
  logging: *default-logging

x-app-storage: &app-storage
  - topscolaire_api_storage:/var/www/html/storage

services:
  # Base de données PostgreSQL 18 — volume EXISTANT conservé (tes données restent)
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bulletinlab}
      POSTGRES_USER: ${DB_USERNAME:-bulletinlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans le fichier d'environnement Compose}
    volumes:
      - topscolaire_pg_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend
    logging: *default-logging

  # Redis (cache, sessions, queue)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - topscolaire_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    logging: *default-logging

  # Migrations (à lancer manuellement avant le premier démarrage / maj)
  migrate:
    <<: *api-service
    profiles:
      - maintenance
    restart: "no"
    command:
      - php
      - artisan
      - migrate
      - --force
    volumes: *app-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # API Laravel (PHP-FPM)
  api:
    <<: *api-service
    restart: unless-stopped
    volumes: *app-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  # Nginx devant PHP-FPM (FastCGI)
  api-nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    volumes:
      - ./docker/api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
    logging: *default-logging

  # Workers de file d'attente
  queue:
    <<: *api-service
    user: "www-data"
    restart: unless-stopped
    command:
      - php
      - artisan
      - queue:work
      - --sleep=2
      - --tries=3
      - --timeout=60
    volumes: *app-storage
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 120s

  # Planificateur Laravel
  scheduler:
    <<: *api-service
    user: "www-data"
    restart: unless-stopped
    command:
      - php
      - artisan
      - schedule:work
    volumes: *app-storage
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # SPA React statique + proxy /api vers l'API
  frontend:
    image: bulletinlab/frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-8080}:80"
    depends_on:
      api-nginx:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

  # Console d'administration PostgreSQL (profil optionnel)
  adminer:
    image: adminer:5
    profiles:
      - tools
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_HTTP_PORT:-8082}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

volumes:
  topscolaire_pg_data:
    driver: local
  topscolaire_redis_data:
    driver: local
  topscolaire_api_storage:
    driver: local

networks:
  backend:
    driver: bridge
