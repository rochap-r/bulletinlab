# Stack de production Docker — BulletinLab
#
# Usage :
#   cp .env.production.example .env.production   # puis renseigner les valeurs
#   docker compose --env-file .env.production up -d --build
#
# Console d'administration de la base (Adminer, profil optionnel) :
#   docker compose --env-file .env.production --profile tools up -d adminer
#   → http://127.0.0.1:8082 (bindé en localhost, tunnel SSH en hébergement public)
#
# Topologie :
#   https://app.<domain>  → frontend:80 (SPA nginx)      → port hôte FRONTEND_HTTP_PORT
#   https://api.<domain>  → api-nginx:80 → api:9000 (fpm) → port hôte API_HTTP_PORT
#   Le TLS est géré en amont (LB / nginx externe de votre hébergeur).

name: bulletinlab

x-api-service: &api-service
  image: bulletinlab/api:latest
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  env_file:
    - .env.production

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bulletinlab}
      POSTGRES_USER: ${DB_USERNAME:-bulletinlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans .env.production}
    volumes:
      # postgres:18+ : montage sur /var/lib/postgresql (les données vivent dans
      # un sous-dossier dédié à la version majeure, ex. 18/docker).
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bulletinlab} -d ${DB_DATABASE:-bulletinlab}"]
      interval: 5s
      timeout: 3s
      retries: 40
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # One-shot : migrations avant le démarrage des autres services applicatifs.
  migrate:
    <<: *api-service
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  # php-fpm (workers www-data).
  api:
    <<: *api-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - api_storage:/var/www/html/storage
    networks: [backend]

  # nginx interne devant php-fpm (fastcgi).
  api-nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    volumes:
      - ./docker/api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_HTTP_PORT:-8081}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]

  # Workers de file d'attente (événements, etc.).
  queue:
    <<: *api-service
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - api_storage:/var/www/html/storage
    networks: [backend]

  # Planificateur (sanctum:prune-expired quotidien, etc.).
  scheduler:
    <<: *api-service
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - api_storage:/var/www/html/storage
    networks: [backend]

  # SPA statique + proxy /api vers l'API.
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
    depends_on:
      api-nginx:
        condition: service_healthy
    networks: [backend]

  # Adminer — console d'administration PostgreSQL (image ~40 Mo, PHP seul).
  # Profil optionnel : jamais démarré par un `up -d` classique, et bindé sur
  # 127.0.0.1 uniquement (en hébergement public : tunnel SSH obligatoire).
  #   docker compose --env-file .env.production --profile tools up -d adminer
  #   → http://127.0.0.1:8082/ (serveur pré-rempli : db)
  adminer:
    image: adminer:5
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_HTTP_PORT:-8082}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

volumes:
  # PostgreSQL.
  pg_data:
  redis_data:
  api_storage:

networks:
  backend:
