# Stack Docker de BulletinLab — Laravel + React + PostgreSQL + Redis.
#
# Usage :
#   cp .env.production.example .env.production
#   docker compose --env-file .env.production config --quiet
#   docker compose --env-file .env.production build
#   docker compose --env-file .env.production --profile maintenance run --rm migrate
#   docker compose --env-file .env.production up -d
#
# Adminer (profil optionnel, bindé sur localhost) :
#   docker compose --env-file .env.production --profile tools up -d adminer

name: ${COMPOSE_PROJECT_NAME:-topscolaire}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-service: &api-service
  image: bulletinlab/api:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  env_file:
    - .env.production
  init: true
  networks:
    - backend
  logging: *default-logging

x-app-storage: &app-storage
  - api_storage:/var/www/html/storage

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bulletinlab}
      POSTGRES_USER: ${DB_USERNAME:-bulletinlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans .env.production}
    volumes:
      # PostgreSQL 18+ stocke les données dans un sous-dossier versionné.
      - pg_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    logging: *default-logging

  # Migrations déclenchées manuellement avant le démarrage / la mise à jour.
  migrate:
    <<: *api-service
    profiles:
      - maintenance
    restart: "no"
    command:
      - php
      - artisan
      - migrate
      - --force
    volumes: *app-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PHP-FPM Laravel.
  api:
    <<: *api-service
    restart: unless-stopped
    volumes: *app-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  # Nginx interne devant PHP-FPM (FastCGI).
  api-nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    volumes:
      - ./docker/api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
    logging: *default-logging

  # Workers de file d'attente.
  queue:
    <<: *api-service
    user: "www-data"
    restart: unless-stopped
    command:
      - php
      - artisan
      - queue:work
      - --sleep=2
      - --tries=3
      - --timeout=60
    volumes: *app-storage
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 120s

  # Planificateur Laravel.
  scheduler:
    <<: *api-service
    user: "www-data"
    restart: unless-stopped
    command:
      - php
      - artisan
      - schedule:work
    volumes: *app-storage
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # SPA React statique + proxy /api vers l'API.
  frontend:
    image: bulletinlab/frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-8080}:80"
    depends_on:
      api-nginx:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

  # Console d'administration PostgreSQL, désactivée par défaut.
  adminer:
    image: adminer:5
    profiles:
      - tools
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_HTTP_PORT:-8082}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local

networks:
  backend:
    driver: bridge
