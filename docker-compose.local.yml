# Stack Docker DEV — BulletinLab (hot reload).
#
# Frontend : Vite dev server (npm run dev) avec HMR — modifications React visibles
#            immédiatement, sans rebuild.
# Backend  : PHP-FPM avec volumes montés, SANS config:cache/route:cache —
#            modifs PHP/Blade visibles immédiatement (rafraîchir le navigateur).
#
# Usage :
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d --build
#   docker compose -f docker-compose.local.yml --env-file .env.local exec api php artisan migrate --force
#
#   Puis ouvrir : http://localhost:5173   (SPA React + HMR)
#                 http://localhost:8081/up (healthcheck API directe)
#
# Après une modif PHP : rien à faire, rafraîchir la page.
# Après une modif React : HMR s'occupe de tout (pas de rebuild).
# Après une modif de .env.local : docker compose -f docker-compose.local.yml --env-file .env.local up -d

name: bulletinlab-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL 18 isolé (port hôte 5433, ne conflit pas avec Herd sur 5432)
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bulletinlab}
      POSTGRES_USER: ${DB_USERNAME:-bulletinlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bulletinlab}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - pg_data_local:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend
    logging: *default-logging

  # Redis (cache / sessions / queue), port hôte 6380
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    logging: *default-logging

  # PHP-FPM Laravel — volumes montés, pas de cache (hot reload du backend)
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file:
      - .env.local
    init: true
    networks:
      - backend
    logging: *default-logging
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p \
          storage/app/private \
          storage/app/public \
          storage/framework/cache \
          storage/framework/sessions \
          storage/framework/views \
          storage/logs \
          bootstrap/cache \
        && chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true \
        && exec php-fpm
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./routes:/var/www/html/routes
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx devant PHP-FPM (FastCGI) — port 8081
  api-nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    volumes:
      - ./docker/api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - backend
    logging: *default-logging

  # Vite dev server — SPA React avec HMR, port 5173
  vite:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.hotreload
    env_file:
      - .env.local
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://api-nginx:80
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api-nginx:
        condition: service_started
    networks:
      - backend
    logging: *default-logging

  # Migrations one-shot
  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file:
      - .env.local
    profiles:
      - maintenance
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./routes:/var/www/html/routes
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

volumes:
  pg_data_local:
    driver: local
  redis_data_local:
    driver: local

networks:
  backend:
    driver: bridge
